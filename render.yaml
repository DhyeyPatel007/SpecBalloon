services:
  - type: web
    name: specballoon-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://spec-balloon.vercel.app,http://localhost:5173"
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: RATE_LIMIT_PER_HOUR
        value: "30"
      - key: GEMINI_API_KEY
        sync: false

